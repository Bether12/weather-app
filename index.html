<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <title>The Weather</title>
</head>
<body>
    <h1>Minimalist Weather</h1>
    <form>
        <label for="location">Write a location:</label>
        <input id="location" name="location" type="text" placeholder="London, Paris, etc" required>
        <button type="submit" id="find-button">Find</button>
    </form>
    <button id="toggleCF">ºF</button>
    <div class="weather-info"></div>
    <script src="./script.js" type="module"></script>
</body>
</html>
